console:
  # Console prompt text (%user% = current user)
  prompt: '&7&a%user%&7@cloud ~> '

  # Show banner on startup
  enable-banner: true

  # Primary color code for console messages and prompt
  # Supported colors: https://www.ditig.com/256-colors-cheat-sheet
  primary-color: 42

  # Show player join and leave messages in the console
  log-player-connections: true

service:
  # Starting port for new services
  service-start-port: 30000

  # Starting port for new proxies
  proxy-start-port: 25565

  # Splitter used in service names
  splitter: '-'

  # Auto updates platform jars to latest build in the same MC version.
  # Also updates MC version if using 'platform-latest'
  auto-update-platforms: true

  # Maximum number of services that can run at the same time (-1 = unlimited)
  max-services: -1

  # Maximum number of services that can start at the same time (-1 = unlimited)
  max-starting-services: -1

  # Timeout in seconds before forcibly killing a service after normal stop attempt
  kill-timeout: 10

  # Enables checking available system memory before starting new services
  memory-check-enabled: false

folders:
  groups: groups
  static: services/static
  temp-services: services/temp
  templates: templates
  platforms: platforms
  modules: modules
  logs: logs
  data: data

node:
  # Node host address
  host: 127.0.0.1

  # Node communication port
  port: 16000

cluster:
  # Enable multi-node clustering
  enabled: false

  # Name of this node
  name: Node-1

  # Cluster token
  token: change-me

  # Other cluster nodes to connect to
  nodes:
  #  - 127.0.0.1:16001
  #  - 127.0.0.1:16002

security:
  # Enable TLS/SSL encryption
  ssl-enabled: false

  # Directory where the certificates are saved
  security-directory: security

  # Require client authentication
  require-client-auth: true

disable-update-checker: false
debug: false

