## ============================================================
## Application
## ============================================================
quarkus.application.name=webinterface-module
quarkus.application.version=1.0.0-SNAPSHOT
## ============================================================
## HTTP
## ============================================================
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
## ============================================================
## OpenAPI / Swagger UI
## ============================================================
## Path config only — title/version/description/security-scheme are
## defined declaratively via @OpenAPIDefinition in OpenApiConfig.java.
## always-include=true makes Swagger UI available outside dev mode too
## (by default it's dev-mode only) — useful for staging environments;
## consider disabling in production if you don't want it public.
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.enabled=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=flattop
## ============================================================
## Security — API Key (for normal client-facing endpoints)
## Read by ApiKeyAuthenticationMechanism / ApiKeyIdentityProvider.
## Override in real deployments via env var APP_SECURITY_API_KEY
## (Quarkus auto-maps dotted/dashed property names to env vars).
## Never commit a real production key.
## ============================================================
app.security.api-keys=local-dev-api-key-change-me
app.security.api-key.header=X-API-Key
## ============================================================
## Security — Webhook (HMAC signature verification)
## Shared secret used to validate X-Webhook-Signature header.
## Override via APP_SECURITY_WEBHOOK_SECRET in real environments.
## ============================================================
app.security.webhook.secret=local-dev-webhook-secret-change-me
app.security.webhook.signature-header=X-Webhook-Signature
app.security.webhook.timestamp-header=X-Webhook-Timestamp
# Reject webhook requests whose timestamp is older than this (replay protection)
app.security.webhook.tolerance-seconds=300
## ============================================================
## WebSockets Next
## ============================================================
quarkus.websockets-next.server.auto-ping-interval=30S
# Belt-and-suspenders: the @Authenticated annotation on TaskSocket already
# secures the HTTP upgrade; this policy documents/reinforces the same intent
# at the path level for /ws/tasks.
quarkus.http.auth.permission.ws-tasks.paths=/ws/tasks
quarkus.http.auth.permission.ws-tasks.policy=authenticated
## ============================================================
## Logging
## ============================================================
quarkus.log.level=INFO
quarkus.log.category."com.example.app".level=DEBUG
%dev.quarkus.log.console.json=false
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false