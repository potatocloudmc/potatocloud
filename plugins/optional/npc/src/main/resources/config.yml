permission: "potatocloud.npc"

look-at-range: 8

default-hologram:
  - "<green><bold>%group%"
  - "<gray>%online_players% players online"

selector:
  title: "<dark_gray>» <green><bold>%group%"
  rows: 5

  service-slots: [11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 29, 30, 31, 32, 33, 34, 35]

  online-item:
    material: LIME_DYE
    display-name: "<green>%name%"
    lore:
      - "<gray>Players: <green>%online_players%/%max_players%"
      - "<gray>State: <green>%state%"
      - " "
      - "<green>Click to join"

  empty-item:
    material: LIGHT_GRAY_DYE
    display-name: "<green>%name%"
    lore:
      - "<gray>Players: <green>%online_players%/%max_players%"
      - "<gray>State: <green>%state%"
      - " "
      - "<green>Click to join"

  full-item:
    material: REDSTONE
    display-name: "<red>%name%"
    lore:
      - "<gray>Players: <green>%online_players%/%max_players%"
      - "<gray>State: <green>%state%"
      - " "
      - "<red>Service is full"

  previous-page:
    slot: 39
    material: ARROW
    display-name: "<gray>« <white>Previous page"
    lore:
      - "<dark_gray>Page %page%/%pages%"

  next-page:
    slot: 43
    material: ARROW
    display-name: "<white>Next page <gray>»"
    lore:
      - "<dark_gray>Page %page%/%pages%"

  fixed-items:
    '1':
      material: BLACK_STAINED_GLASS_PANE
      display-name: " "
      lore: []
