prefix: "<dark_gray>» <gradient:#55FF55:#DAF3DA>potatocloud</gradient> <dark_gray>• <reset>"
no-permission: "<red>You do not have enough permissions for this command"
only-players: "<red>Only players can use this command"

npc-not-found: "<red>No npc found with the name <green>%name%"
npc-exists: "<red>An npc with the name <green>%name% <red>already exists"
no-group: "<red>No service group found with the name <green>%name%"
invalid-name: "<red>The name <green>%name% <red>is invalid. Only use letters, numbers, _ and -"
invalid-type: "<red>Unknown npc type <green>%value%<red>. Use <green>player <red>or <green>mob"
invalid-skin: "<red>The skin name <green>%value% <red>is invalid"
invalid-entity: "<red>The entity <green>%value% <red>can not be used for npcs"
invalid-action: "<red>Unknown action <green>%value%<red>. Use <green>none<red>, <green>selector<red>, <green>connect<red>, <green>command <red>or <green>message"
only-player-npc: "<red>Only player npcs have a skin"
only-mob-npc: "<red>Only mob npcs have an entity type"
world-not-loaded: "<red>The world <green>%world% <red>is not loaded"

created: "<gray>The npc <green>%name% <gray>was created"
deleted: "<gray>The npc <green>%name% <gray>was deleted"
teleported: "<gray>You were teleported to <green>%name%"
moved: "<gray>The npc <green>%name% <gray>was moved to you"
edited: "<gray>Set <green>%option% <gray>of <green>%name% <gray>to <green>%value%"
hologram-edited: "<gray>The hologram of <green>%name% <gray>was updated"
action-set: "<gray>The <green>%click% <gray>click action of <green>%name% <gray>is now <green>%action%"
reloaded: "<gray>The config and all npcs were reloaded"

connecting: "<gray>Connecting to <green>%service%<gray>..."
already-connected: "<red>You are already connected to <green>%service%"
service-not-available: "<red>The service <green>%service% <red>is not available"
no-service: "<red>There is no free service of <green>%group% <red>online"

list:
  empty: "<red>There are no npcs"
  header: "<gray>All npcs<dark_gray>:"
  entry: "<dark_gray>» <green>%name% <dark_gray>(<gray>%group%<dark_gray>)"

info:
  name: "<gray>Name: <green>%name%"
  type: "<gray>Type: <green>%type%"
  group: "<gray>Group: <green>%group%"
  location: "<gray>Location: <green>%world% %x% %y% %z%"
  look-at-player: "<gray>Look at player: <green>%value%"
  left-click: "<gray>Left click: <green>%action%"
  right-click: "<gray>Right click: <green>%action%"
  hologram: "<gray>Hologram:"
  hologram-line: "<dark_gray>  %line%. <reset>%text%"

