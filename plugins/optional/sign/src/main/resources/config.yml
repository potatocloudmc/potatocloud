permission: "potatocloud.sign"

update-interval: 10

# Services with one of these game states are not shown on signs
hidden-states:
  - "INGAME"

# Pushes players without the permission away from signs
knockback:
  enabled: true
  distance: 1.5
  strength: 0.8
  sound:
    enabled: true
    name: "entity.bat.takeoff"

layouts:
  online:
    '1':
      - "<dark_gray>» <dark_green><bold>%name%</bold> <dark_gray>«"
      - "<gray>%state%"
      - "<dark_green>%online_players% <dark_gray>/ <gray>%max_players%"
      - "<dark_gray>▸ <dark_green>Click to join"

  full:
    '1':
      - "<dark_gray>» <dark_red><bold>%name%</bold> <dark_gray>«"
      - "<gray>%state%"
      - "<dark_red>%online_players% <dark_gray>/ <gray>%max_players%"
      - "<dark_gray>▸ <dark_red>Full"

  searching:
    '1':
      - "<dark_gray>» <gray><bold>%group%</bold> <dark_gray>«"
      - "<gray>Waiting for"
      - "<gray>a server"
      - "<dark_green>■ <dark_gray>■ ■"
    '2':
      - "<dark_gray>» <gray><bold>%group%</bold> <dark_gray>«"
      - "<gray>Waiting for"
      - "<gray>a server"
      - "<dark_gray>■ <dark_green>■ <dark_gray>■"
    '3':
      - "<dark_gray>» <gray><bold>%group%</bold> <dark_gray>«"
      - "<gray>Waiting for"
      - "<gray>a server"
      - "<dark_gray>■ ■ <dark_green>■"
    '4':
      - "<dark_gray>» <gray><bold>%group%</bold> <dark_gray>«"
      - "<gray>Waiting for"
      - "<gray>a server"
      - "<dark_gray>■ <dark_green>■ <dark_gray>■"
